# docker-compose.yml — Drift Local Development Stack
#
# What this file starts:
#   - VictoriaLogs  (log storage, :9428)
#   - Vector        (log shipper: tails app logs → VictoriaLogs)
#   - drift-api     (Dropwizard HTTP service, app :8000, admin :8001)
#   - drift-worker  (Dropwizard Temporal worker, app :7200, admin :7201)
#
# What this file does NOT start (already running in Rancher Desktop):
#   - Temporal      (:7233 gRPC, :8080 UI)
#   - HBase         (:2181 ZooKeeper, :9090 Thrift)
#   - Redis Sentinel (:26379, :6379)
#
# Usage:
#   docker compose up -d                        # start full stack (observability + api + worker)
#   docker compose up -d victorialogs vector    # start observability only
#   docker compose down                         # stop all services
#   docker compose logs -f drift-api            # tail API logs
#   docker compose logs -f drift-worker         # tail Worker logs
#   docker compose logs -f vector               # tail vector log shipper
#
# Prerequisites:
#   - Build JARs first: mvn clean package -DskipTests -pl java-sdk,commons,api,worker -am
#   - .env file at repo root with required variables (see .env.example)
#
# Alternatively, use boot.sh for native JVM process mode:
#   bash scripts/agent/boot.sh                  # native processes (app-runtime: local)
#   bash scripts/agent/boot.sh --docker         # Docker Compose mode (delegates here)


services:

  # ─────────────────────────────────────────────────────────────────────────
  # VictoriaLogs — single-node log storage backend
  # Receives logs from Vector, serves LogsQL query API on :9428
  # ─────────────────────────────────────────────────────────────────────────
  victorialogs:
    image: victoriametrics/victoria-logs:v0.28.0-victorialogs
    container_name: drift-victorialogs
    restart: unless-stopped
    ports:
      - "9428:9428"
    volumes:
      - victorialogs_data:/vlogs
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=7d
      - -httpListenAddr=:9428
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ─────────────────────────────────────────────────────────────────────────
  # Vector — log collection agent
  # Tails log files written by drift-api and drift-worker (when running as
  # native processes), parses them, and forwards to VictoriaLogs.
  # ─────────────────────────────────────────────────────────────────────────
  vector:
    image: timberio/vector:0.38.0-debian
    container_name: drift-vector
    restart: unless-stopped
    depends_on:
      victorialogs:
        condition: service_healthy
    volumes:
      - ./scripts/infra/vector.yaml:/etc/vector/vector.yaml:ro
      # Mount the host log directory so Vector can tail app log files
      # when services run as native processes (app-runtime: local).
      # Must be under $HOME — Rancher Desktop (Lima) does not share /tmp.
      - ${HOME}/.drift-logs:/var/log/drift:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      - VECTOR_LOG=info

volumes:
  victorialogs_data:
    driver: local
